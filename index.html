<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#fff5f8" />
    <meta name="format-detection" content="telephone=no" />
    <title>Happy Birthday Rangoli! 🎂✨</title>
    <meta name="description" content="A special interactive birthday celebration for Rangoli on 19th November, filled with chai vibes, F1 energy, classic car love, confetti, and birthday games." />
    <!-- Google Fonts asynchronously loaded to guarantee 0ms render-blocking in Safari -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      (function() {
        function loadFonts() {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = 'https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap';
          document.head.appendChild(link);
        }
        if (document.readyState === 'complete') {
          loadFonts();
        } else {
          window.addEventListener('load', loadFonts);
        }
      })();
    </script>
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap">
    </noscript>
  </head>
  <body class="bg-[#fff5f8] text-[#2e1a24] antialiased selection:bg-pink-400 selection:text-white">
    <!-- Immediate 0ms Splash Screen: Displays requested message until bundle finishes loading -->
    <div id="root">
      <div id="initial-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff5f8;z-index:99999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-user-select:none;user-select:none;text-align:center;padding:1rem;">
        <div style="background:rgba(255,255,255,0.92);border:1.5px solid rgba(244,114,182,0.4);box-shadow:0 15px 40px -10px rgba(236,72,153,0.18),0 0 25px rgba(254,205,222,0.5);border-radius:1.5rem;padding:2rem 1.5rem;max-width:340px;width:100%;display:flex;flex-direction:column;align-items:center;gap:1rem;">
          <div style="font-size:3.5rem;line-height:1;animation:bounce 1.2s infinite ease-in-out;">🎂</div>
          <div style="display:inline-block;padding:0.25rem 0.75rem;border-radius:9999px;background:#fce7f3;color:#be185d;font-size:0.7rem;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;">
            19th November Birthday Special
          </div>
          <div style="font-weight:900;font-size:1.25rem;color:#0f172a;line-height:1.25;">
            Rangoli's Birthday Wish is Loading
          </div>
          <div style="font-size:0.8rem;color:#475569;font-weight:600;line-height:1.4;">
            A little patience please... Preparing all the surprises for Rangoli! 🌸
          </div>
          <div style="width:100%;height:8px;background:#fce7f3;border-radius:9999px;overflow:hidden;position:relative;margin-top:0.25rem;">
            <div style="width:60%;height:100%;background:linear-gradient(90deg,#ec4899,#a855f7);border-radius:9999px;"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
